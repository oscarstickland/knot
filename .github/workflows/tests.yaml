name: Backend Tests

on:
  pull_request:

jobs:
  backend-tests:
    runs-on: self-hosted
    container:
      image: oven/bun:1.3
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock

    env:
      JWT_SECRET: abc123

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test
        working-directory: ./backend