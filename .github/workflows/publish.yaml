name: Publish Docker Image

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: oven/bun:1.3
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock

    env:
      JWT_SECRET: abc123

    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test
        working-directory: ./backend

  publish-docker:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Login to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.sha }}
            ghcr.io/${{ github.repository }}:latest

      - name: Bump image tag for ArgoCD (GitOps commit)
        run: |
          cd deploy/overlays/prod
          npx --yes kustomize@5.4.3 edit set image \
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.sha }}
          cd -
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deploy): bump image to ${{ steps.meta.outputs.sha }}" || echo "nothing to commit"
          git push
