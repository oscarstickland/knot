apiVersion: apps/v1
kind: Deployment
metadata:
  name: knot-web
  labels:
    app: knot-web
spec:
  replicas: 2
  revisionHistoryLimit: 4
  selector:
    matchLabels:
      app: knot-web
  template:
    metadata:
      labels:
        app: knot-web
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: web
          image: ghcr.io/oscarstickland/knot:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: knot-web-config
            - secretRef:
                name: knot-web-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: knot-web
spec:
  selector:
    app: knot-web
  ports:
    - port: 80
      targetPort: 3000
